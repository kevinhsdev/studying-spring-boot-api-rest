spring.application.name=financas

# Hibernate cria/atualiza as tabelas a partir das entidades. Bom para aprender;
# em produção se usa uma ferramenta de migração (Flyway) no lugar.
spring.jpa.hibernate.ddl-auto=update

# Mostra no console o SQL que o Hibernate gera. Didático!
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
